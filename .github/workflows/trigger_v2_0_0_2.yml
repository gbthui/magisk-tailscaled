name: Trigger v2.0.0.2 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger_v2_0_0_2.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish tag
        run: |
          git tag -f v2.0.0.2
          git push origin refs/tags/v2.0.0.2 --force
